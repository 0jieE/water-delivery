# Optional: run PostgreSQL in Docker instead of installing it locally.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: water_refilling
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
